name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh build.sh && (cd out && sha256sum * > SHA256SUMS.txt)
      - run: gh release create "$GITHUB_REF_NAME" out/* --notes-file RELEASE.md
        env:
          GH_TOKEN: ${{ github.token }}
